# =============================================================================
# Scenario 1: Generalization - LoRA Configuration (Baseline)
# =============================================================================
# Model: Qwen/Qwen2.5-3B (Base)
# Dataset: uitnlp/ViANLI
# Technique: LoRA (Rank 32, Alpha 64)

model:
  model_name: "Qwen/Qwen2.5-3B"
  max_seq_length: 512
  load_in_4bit: true                     # Standard LoRA can run in 4-bit easily
  dtype: "bfloat16"

peft:
  method: "lora"
  r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  init_lora_weights: true                # Standard Kaiming/Gaussian initialization
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"

training:
  learning_rate: 2.0e-4                  # Standard LoRA learning rate
  num_train_epochs: 1                    # Same as PiSSA optimized run
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8         # Effective BS = 32
  warmup_steps: 100
  weight_decay: 0.01
  logging_steps: 1
  optim: "adamw_8bit"
  seed: 42
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "no"

data:
  dataset_name: "uitnlp/ViANLI"
  prompt_template: "User: \"Câu 1: {premise}. Câu 2: {hypothesis}. Mối quan hệ giữa hai câu là gì?\"\nAssistant: \"{label_text}\""

output:
  output_dir: "outputs/checkpoints/scenario1_lora"
  results_dir: "outputs/results/scenario1_lora"

wandb:
  project: "DoRA-vs-PiSSA-Scenario1"
  run_name: "qwen2.5-3b-lora-r32"
